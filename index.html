<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ausblick">
<title>Ausblick – Clientes</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Ausblick – which possible customers we have contacted, with phone, place and website.
   Data: own private GitHub repository (clientes.json). The token on a device can only reach that repository.
   Built like work.castcomercial.com: the token is published encrypted (access.json) and opened with a 12-character code. */
:root{--bg:#f6f6f6;--card:#fff;--text:#111;--muted:#6f6f6f;--line:#e3e3e3;--accent:#111;--accent-soft:#ececec;--on-accent:#fff;--in:#15803d;--in-soft:#dcf5e4;--out:#c62828;--out-soft:#fde4e4;--warn:#b45309;--warn-soft:#fdeed3;--vio:#4a5568;--vio-soft:#e9ecf1}
@media (prefers-color-scheme: dark){:root{--bg:#0b0b0b;--card:#161616;--text:#f2f2f2;--muted:#a3a3a3;--line:#2a2a2a;--accent:#f2f2f2;--accent-soft:#262626;--on-accent:#111;--in:#4ade80;--in-soft:#12301f;--out:#f87171;--out-soft:#3a1a1a;--warn:#fbbf24;--warn-soft:#3a2a0d;--vio:#c3cad6;--vio-soft:#23272e}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
main{max-width:1232px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.logo{width:44px;height:44px;border-radius:12px;background:#111;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.logo img{width:30px;height:auto;display:block;margin-top:2px}
.brand{display:block;font-size:11px;font-weight:400;letter-spacing:.32em;color:var(--muted);margin-bottom:1px}
.top h1{font-size:20px;margin:0;line-height:1.15;min-width:0;flex:1}
.top .sub{display:block;font-size:14px;color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.icon.add{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{border-radius:14px;padding:0 20px;min-height:52px;font-size:17px;font-weight:700;cursor:pointer;background:var(--card);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.go{background:var(--in);color:#fff;border-color:var(--in)}
.btn.danger{color:var(--out);border-color:var(--out);background:var(--card)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.msg{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px}
.msg.err{background:var(--out-soft);color:var(--out)} .msg.ok{background:var(--in-soft);color:var(--in)} .msg.warn{background:var(--warn-soft);color:var(--warn)}
.field{margin-bottom:14px} .field label,.lbl{display:block;font-weight:650;margin-bottom:6px;font-size:15px}
.field input,.field textarea,.search{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:17px}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field textarea:focus,.search:focus{outline:none;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px}
.tabs button,.chips button,.est button,.views button{border:2px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;cursor:pointer;padding:8px 10px;font-size:15px}
.tabs button.on,.chips button.on,.est button.on,.views button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:24px;letter-spacing:.06em;text-align:center;padding:12px;border:2px dashed var(--accent);border-radius:12px;margin:8px 0 12px;user-select:all}
.bar{display:flex;gap:8px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips button{white-space:nowrap;flex:none;padding:6px 12px;border-radius:999px}
.chips .n{color:var(--muted);font-weight:600;margin-left:4px}
.chips button.on .n{color:inherit}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.item:hover{border-color:var(--accent)}
.ih{display:flex;align-items:flex-start;gap:10px}
.iname{flex:1;min-width:0;font-weight:700;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.iname small{display:block;color:var(--muted);font-weight:500;font-size:14px}
.badge{flex:none;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.b-nuevo{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.b-contactado{background:var(--accent-soft);color:var(--accent)}
.b-interesado{background:var(--warn-soft);color:var(--warn)}
.b-cliente{background:var(--in-soft);color:var(--in)}
.b-descartado{background:var(--out-soft);color:var(--out)}
.info{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:15px}
.info span,.info a{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere}
.info svg{flex:none;color:var(--muted)}
.info .none{color:var(--muted)}
.last{margin-top:6px;font-size:14px;color:var(--muted)}
.empty{color:var(--muted);padding:14px 16px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)} .pill.err,.pill.wait{cursor:pointer;text-decoration:underline dotted}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--in)} .pill.wait i{background:var(--warn)} .pill.err i{background:var(--out)}
.ov{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto}
.sheet h3{margin:0 0 14px;font-size:20px}
.est{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.row2{display:flex;gap:10px;flex-wrap:wrap} .row2 .btn{flex:1}
.quick{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.quick a{flex:1;min-width:110px;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:700;color:var(--text)}
.log{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.log li{border-left:3px solid var(--accent);padding:4px 0 4px 10px;font-size:15px}
.log li small{display:block;color:var(--muted);font-size:13px}
.addlog{display:flex;gap:8px} .addlog input{flex:1;min-width:0;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;border:1px solid #333;border-radius:12px;padding:12px 14px;display:flex;gap:14px;align-items:center;z-index:60;width:max-content;max-width:calc(100% - 32px);font-size:16px}
.toast button{background:none;border:0;color:#fff;text-decoration:underline;font-weight:700;cursor:pointer;font-size:16px}
.req{color:var(--out)}
.hub{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
.hub button{border:0;border-radius:10px;background:none;font-weight:750;font-size:16px;padding:10px;cursor:pointer;color:var(--muted)}
.hub button.on{background:var(--accent);color:var(--on-accent)}
.hub .n{font-weight:600;margin-left:6px;opacity:.8}
#setup{max-width:728px;margin:0 auto}

.board{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding:2px 2px 16px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.lane{flex:0 0 min(86vw,300px);scroll-snap-align:start;background:var(--bg);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;max-width:300px}
@media (prefers-color-scheme: dark){.lane{background:#111}}
.lh{display:flex;align-items:center;gap:6px;padding:10px 10px 6px 14px}
.lh b{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
.lh .n{color:var(--muted);font-weight:700;font-size:14px}
.lh button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px;border-radius:8px}
.lh button:hover{background:var(--card)}
.cards{list-style:none;margin:0;padding:4px 8px;display:grid;gap:8px;min-height:44px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.kc:hover{border-color:var(--accent)}
.kc.prio{border-left:4px solid var(--out)}
.kc .kt{font-weight:650;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.kc .km{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px;font-size:13px;color:var(--muted)}
.kc .km span{display:inline-flex;align-items:center;gap:4px}
.kc .due.late{color:var(--out);font-weight:700} .kc .due.soon{color:var(--warn);font-weight:700}
.kc .who{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 8px;font-weight:700}
.kc .cu{color:var(--vio);font-weight:600}
.kc.dragging{opacity:.35}
.ghost{position:fixed;z-index:80;pointer-events:none;transform:rotate(2deg);box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:.95}
.ph{border:2px dashed var(--accent);border-radius:12px;background:var(--accent-soft);list-style:none}
.ladd{margin:6px 8px 10px;border:1px dashed var(--line);background:none;border-radius:12px;padding:10px;font-weight:700;color:var(--muted);cursor:pointer;font-size:15px}
.ladd:hover{color:var(--accent);border-color:var(--accent)}
.newlane{flex:0 0 220px;border:2px dashed var(--line);border-radius:16px;background:none;padding:18px;font-weight:700;color:var(--muted);cursor:pointer;font-size:15px}
.lanesel{display:flex;flex-wrap:wrap;gap:6px}
.lanesel button{border:2px solid var(--line);border-radius:999px;background:var(--card);font-weight:700;cursor:pointer;padding:6px 12px;font-size:14px}
.lanesel button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.prio-t{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.prio-t input{width:20px;height:20px;accent-color:var(--out)}
.tlist{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:6px}
.tlist li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:15px;display:flex;gap:8px;align-items:center}
.tlist li small{margin-left:auto;color:var(--muted);white-space:nowrap}
.docs{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start;max-width:1200px;margin:0 auto}
.dside{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
.dside .search{margin-bottom:8px}
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0;padding:0 0 0 14px}
.tree .node{display:flex;align-items:center;gap:2px;border-radius:8px}
.tree .node a{flex:1;min-width:0;padding:7px 8px;border-radius:8px;color:var(--text);text-decoration:none;font-size:15px;overflow-wrap:anywhere;cursor:pointer}
.tree .node a:hover{background:var(--bg)}
.tree .node.on a{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tree .tg{width:24px;height:24px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:6px;flex:none;font-size:12px}
.tree .tg.leaf{visibility:hidden}
.dnew{width:100%;margin-top:8px}
.dpage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 24px;min-width:0}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:6px;overflow-wrap:anywhere}
.crumbs a{color:var(--muted);cursor:pointer;text-decoration:none} .crumbs a:hover{color:var(--accent)}
.dpage h2.dt{margin:0 0 4px;font-size:28px;line-height:1.2;overflow-wrap:anywhere}
.dmeta{color:var(--muted);font-size:14px;margin-bottom:14px}
.dbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.dbar .btn{min-height:42px;font-size:15px;padding:0 14px}
.dback{display:none}
.md{font-size:16px;line-height:1.6;overflow-wrap:anywhere}
.md h1,.md h2,.md h3,.md h4{line-height:1.25;margin:1.2em 0 .4em} .md h1{font-size:24px} .md h2{font-size:21px} .md h3{font-size:18px} .md h4{font-size:16px}
.md > :first-child{margin-top:0}
.md p{margin:.6em 0} .md ul,.md ol{margin:.5em 0;padding-left:1.5em} .md li{margin:.2em 0}
.md li.task{list-style:none;margin-left:-1.4em} .md li.task input{width:18px;height:18px;vertical-align:-3px;margin-right:6px;accent-color:var(--in);cursor:pointer}
.md li.task.done > span{text-decoration:line-through;color:var(--muted)}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.05em .35em}
.md pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto} .md pre code{border:0;padding:0;background:none}
.md blockquote{margin:.8em 0;padding:.2em 0 .2em 14px;border-left:4px solid var(--accent);color:var(--muted)}
.md hr{margin:1.2em 0}
.md table{border-collapse:collapse;margin:.8em 0;display:block;overflow-x:auto;max-width:100%} .md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left} .md th{background:var(--bg)}
.md a.wl{color:var(--vio);font-weight:600;cursor:pointer} .md a.wl.missing{color:var(--out);text-decoration:underline dotted}
.dempty{color:var(--muted);text-align:center;padding:40px 10px}
.dhits{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.dhits li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.dhits li small{display:block;color:var(--muted);font-size:13px}
.sheet.big{max-width:960px;height:calc(100vh - 32px);display:flex;flex-direction:column}
.etools{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.etools button{border:1px solid var(--line);background:var(--card);border-radius:8px;min-width:38px;height:36px;font-weight:700;cursor:pointer;font-size:14px;padding:0 8px}
.etabs{display:flex;gap:6px;margin-left:auto}
.etabs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ebody{flex:1;min-height:200px;display:flex}
.ebody textarea{flex:1;width:100%;resize:none;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ebody textarea:focus{outline:none;border-color:var(--accent)}
.ebody .md{flex:1;overflow:auto;border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px}
.hist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px;max-height:50vh;overflow:auto}
.hist li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center}
.hist li span{flex:1;min-width:0} .hist li small{display:block;color:var(--muted)}
.hist li button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:700}
@media (max-width:760px){
  .docs{grid-template-columns:1fr} .dside{position:static;max-height:none}
  .docs.reading .dside{display:none} .docs:not(.reading) .dpage{display:none}
  .dback{display:inline-flex;align-items:center} .dpage{padding:16px}
  .sheet.big{height:calc(100vh - 16px);padding:14px} .ov{padding:8px}
}
@media (max-width:480px){ .hub button{font-size:14px;padding:8px 2px;line-height:1.2} .hub .n{display:block;margin:0;font-size:12px} }
.cauldron{max-width:1200px;margin:0 auto;display:grid;gap:16px}
.cwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start} .cwrap>*,.cwrap>*>*{min-width:0} .cside .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .cside .row2 .field{min-width:0} #cauldron select{width:100%;max-width:100%}
@media (max-width:900px){ .cwrap{grid-template-columns:minmax(0,1fr)} }
.stage{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px 14px;text-align:center;position:relative;overflow:hidden}
.stage .hint{margin:0 0 6px}
.pot{position:relative;width:min(100%,380px);margin:0 auto;aspect-ratio:1/0.86;border-radius:24px;transition:transform .2s}
.pot svg{width:100%;height:100%;display:block}
.pot .liq{fill:var(--accent);opacity:.92;transition:fill .4s}
.pot .body{fill:#111} .pot .rim{fill:#1d1d1d;stroke:#3a3a3a;stroke-width:3} .pot .leg{fill:#111}
@media (prefers-color-scheme: dark){ .pot .body,.pot .leg{fill:#262626} .pot .rim{fill:#303030;stroke:#4a4a4a} }
.pot.over{transform:scale(1.04)} .pot.over .rim{stroke:var(--in);stroke-width:6}
.pot .bub{fill:var(--card);opacity:0;animation:bub 2.6s infinite ease-in}
.pot.full .bub{opacity:.9}
@keyframes bub{0%{transform:translateY(0) scale(.4);opacity:0}20%{opacity:.85}100%{transform:translateY(-70px) scale(1.1);opacity:0}}
.pot.brew{animation:brew .9s ease-in-out}
@keyframes brew{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.pot .inside{position:absolute;left:12%;right:12%;top:20%;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;pointer-events:none}
.ing{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px;font-weight:700;animation:drop .35s ease-out}
.ing button{border:0;background:var(--bg);color:var(--muted);border-radius:999px;width:20px;height:20px;cursor:pointer;line-height:1;font-size:13px;padding:0}
@keyframes drop{0%{transform:translateY(-30px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.ppl{color:var(--muted);font-size:14px;margin-top:4px}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
@media (max-width:620px){ .tray{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px} .tray .mod{flex:0 0 150px;scroll-snap-align:start} }
.mod{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;text-align:left;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;position:relative;transition:border-color .15s,transform .15s}
.mod:hover{border-color:var(--accent);transform:translateY(-2px)}
.mod .mi{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-bottom:8px}
.mod b{display:block;font-size:16px}

    if(pdirty){ pdirty = false; store.set(PKEY.dirty, pdirty); try{ await save(PFILE, fusions, true); }catch(e){ pdirty = true; store.set(PKEY.dirty, pdirty); throw e; } }
    else { var pc = await load(PFILE); merge(pc.c, fusions, true); }
    store.set(PKEY.data, fusions);
    sync.err = null; setSync('ok', 's_saved', hm(Date.now()));
  }catch(e){
    if(/http 401/.test(e.message)){
      var fresh = null; try{ fresh = await openAccess(cfg.code); }catch(x){}
      if(fresh && fresh.token !== cfg.token){ cfg.token = fresh.token; cfg.repo = fresh.repo; store.set(KEY.cfg, cfg); sync.busy = false; return syncNow(); }   /* someone replaced the token */
      setSync('err', 's_expired');
    }
    else {
      sync.err = { at: Date.now(), detail: e.detail || (e.name + ': ' + e.message), online: navigator.onLine };
      try{ console.error('[ausblick sync]', sync.err.detail, e); }catch(x){}
      var anyDirty = dirty || tdirty || ddirty || pdirty;
      if(e.status) setSync(anyDirty ? 'wait' : 'err', anyDirty ? 's_later_err' : 's_error', e.status);
      else setSync(anyDirty ? 'wait' : 'err', anyDirty ? 's_later' : 's_offline');
    }
  }
  sync.busy = false; render();
  if(sync.again){ sync.again = false; syncNow(); }
}
setInterval(function(){ if(cfg && document.visibilityState === 'visible') syncNow(); }, 60000);
addEventListener('online', function(){ syncNow(); });
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') syncNow(); });

applyLang();
show();
if(cfg){ setSync(dirty || tdirty || ddirty || pdirty ? 'wait' : 'ok', '…'); syncNow(); }
window.__ac = { get fusions(){ return fusions; }, blueprint: function(f){ return blueprint(f); }, tenantSettings: function(f){ return tenantSettings(f); }, get docs(){ return docs; }, md: function(s){ return md(s); }, get tasks(){ return tasks; }, get data(){ return data; }, get cfg(){ return cfg; }, syncNow: syncNow, sealAccess: sealAccess, setLang: setLang };
})();
</script>
