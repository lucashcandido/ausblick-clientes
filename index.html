<style>
/* Ausblick – which possible customers we have contacted, with phone, place and website.
   Data: own private GitHub repository (clientes.json). The token on a device can only reach that repository.
   Built like work.castcomercial.com: the token is published encrypted (access.json) and opened with a 12-character code. */
:root{--bg:#f3f4f7;--card:#fff;--text:#171a21;--muted:#667085;--line:#e2e5eb;--accent:#1d4ed8;--accent-soft:#e3ebff;--in:#15803d;--in-soft:#dcf5e4;--out:#c62828;--out-soft:#fde4e4;--warn:#b45309;--warn-soft:#fdeed3;--vio:#7c3aed;--vio-soft:#ede5ff}
@media (prefers-color-scheme: dark){:root{--bg:#0f1218;--card:#191d26;--text:#eef0f4;--muted:#98a2b3;--line:#2a303c;--accent:#6b93ff;--accent-soft:#1d2a4d;--in:#4ade80;--in-soft:#12301f;--out:#f87171;--out-soft:#3a1a1a;--warn:#fbbf24;--warn-soft:#3a2a0d;--vio:#b79bff;--vio-soft:#2a1f45}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.top h1{font-size:20px;margin:0;line-height:1.15;min-width:0;flex:1}
.top .sub{display:block;font-size:14px;color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.icon.add{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{border-radius:14px;padding:0 20px;min-height:52px;font-size:17px;font-weight:700;cursor:pointer;background:var(--card);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.go{background:var(--in);color:#fff;border-color:var(--in)}
.btn.danger{color:var(--out);border-color:var(--out);background:var(--card)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.msg{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px}
.msg.err{background:var(--out-soft);color:var(--out)} .msg.ok{background:var(--in-soft);color:var(--in)} .msg.warn{background:var(--warn-soft);color:var(--warn)}
.field{margin-bottom:14px} .field label,.lbl{display:block;font-weight:650;margin-bottom:6px;font-size:15px}
.field input,.field textarea,.search{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:17px}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field textarea:focus,.search:focus{outline:none;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px}
.tabs button,.chips button,.est button,.views button{border:2px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;cursor:pointer;padding:8px 10px;font-size:15px}
.tabs button.on,.chips button.on,.est button.on,.views button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:24px;letter-spacing:.06em;text-align:center;padding:12px;border:2px dashed var(--accent);border-radius:12px;margin:8px 0 12px;user-select:all}
.bar{display:flex;gap:8px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips button{white-space:nowrap;flex:none;padding:6px 12px;border-radius:999px}
.chips .n{color:var(--muted);font-weight:600;margin-left:4px}
.chips button.on .n{color:inherit}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.item:hover{border-color:var(--accent)}
.ih{display:flex;align-items:flex-start;gap:10px}
.iname{flex:1;min-width:0;font-weight:700;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.iname small{display:block;color:var(--muted);font-weight:500;font-size:14px}
.badge{flex:none;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.b-nuevo{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.b-contactado{background:var(--accent-soft);color:var(--accent)}
.b-interesado{background:var(--warn-soft);color:var(--warn)}
.b-cliente{background:var(--in-soft);color:var(--in)}
.b-descartado{background:var(--out-soft);color:var(--out)}
.info{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:15px}
.info span,.info a{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere}
.info svg{flex:none;color:var(--muted)}
.info .none{color:var(--muted)}
.last{margin-top:6px;font-size:14px;color:var(--muted)}
.empty{color:var(--muted);padding:14px 16px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--in)} .pill.wait i{background:var(--warn)} .pill.err i{background:var(--out)}
.ov{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto}
.sheet h3{margin:0 0 14px;font-size:20px}
.est{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.row2{display:flex;gap:10px;flex-wrap:wrap} .row2 .btn{flex:1}
.quick{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.quick a{flex:1;min-width:110px;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:700;color:var(--text)}
.log{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.log li{border-left:3px solid var(--accent);padding:4px 0 4px 10px;font-size:15px}
.log li small{display:block;color:var(--muted);font-size:13px}
.addlog{display:flex;gap:8px} .addlog input{flex:1;min-width:0;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#171a21;color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:14px;align-items:center;z-index:60;width:max-content;max-width:calc(100% - 32px);font-size:16px}
.toast button{background:none;border:0;color:#9db8ff;font-weight:700;cursor:pointer;font-size:16px}
.req{color:var(--out)}
.views{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px} .views button{padding:10px;font-size:16px} .views .n{color:var(--muted);font-weight:600;margin-left:6px} .views button.on .n{color:inherit}
.sortbar{display:flex;gap:8px;margin-top:10px} .sortbar .btn{flex:1;min-height:46px;font-size:16px;padding:0 10px}
li.hint{list-style:none;color:var(--muted);font-size:14px;padding:0 4px 4px}
.lang{display:flex;gap:4px;flex:none}
.lang button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 8px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.lang button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.lang.big{margin-bottom:6px} .lang.big button{flex:1;padding:10px;font-size:15px}

</head>
<body>
<main>
  <!-- set-up (once per device) -->
  <section id="setup" hidden>
    <div class="top"><div class="logo">A</div><h1>Ausblick – <span data-t="title"></span><span class="sub" data-t="setup_sub"></span></h1><div class="lang" id="langTop"></div></div>
    <div class="card">
      <div class="tabs"><button type="button" data-mode="code" class="on" data-t="tab_code"></button><button type="button" data-mode="token" data-t="tab_token"></button></div>
      <div class="field"><label for="sName" data-t="name"></label><input id="sName" autocomplete="given-name" placeholder="Lucas"><p class="hint" data-t="name_hint"></p></div>
      <div id="mCode">
        <div class="field"><label for="sCode" data-t="code"></label><input id="sCode" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX"><p class="hint" data-t="code_hint"></p></div>
      </div>
      <div id="mToken" hidden>
        <div class="field"><label for="sToken" data-t="token"></label><input id="sToken" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"><p class="hint" data-th="token_hint"></p></div>
        <div class="field"><label for="sRepo" data-t="repo"></label><input id="sRepo" autocomplete="off" spellcheck="false"></div>
      </div>
      <button class="btn primary wide" id="sGo" type="button" data-t="go"></button>
      <button class="btn wide" id="sBack" type="button" hidden style="margin-top:10px" data-t="back"></button>
      <div id="sMsg"></div>
    </div>
  </section>

  <!-- the list -->
  <section id="app" hidden>
    <div class="top">
      <div class="logo">A</div>
      <h1><span data-t="title"></span><span class="sub"><span class="pill" id="sync"><i></i><span>—</span></span></span></h1>
      <button class="icon add" id="add" type="button" data-ta="add"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon" id="gear" type="button" data-ta="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="bar"><input class="search" id="q" type="search" data-tp="search" autocomplete="off"></div>
    <div class="views" id="views"></div>
    <div class="chips" id="chips"></div>
    <ul class="list" id="list"></ul>
  </section>
</main>

        (x.web ? (w ? '<a href="' + esc(w) + '" target="_blank" rel="noopener noreferrer" data-stop>' + ICON.web + esc(webHost(x.web)) + '</a>' : '<span>' + ICON.web + esc(x.web) + '</span>') : '<span class="none">' + ICON.web + esc(t('no_web')) + '</span>') +
      '</div>' +
      (l ? '<div class="last">' + esc(t('last', dayText(l.d))) + (l.by ? ' · ' + esc(l.by) : '') + (l.n ? ' — ' + esc(l.n) : '') + '</div>' : '') +
      (view === 'sort' ? '<div class="sortbar"><button class="btn go" type="button" data-ok="' + esc(x.id) + '">' + esc(t('exists')) + '</button><button class="btn danger" type="button" data-no="' + esc(x.id) + '">' + esc(t('notexists')) + '</button></div>' : '') +
      '</li>';
  }).join('') + (total > rows.length ? '<li><button class="btn wide" id="more" type="button">' + esc(t('more', total - rows.length)) + '</button></li>' : '');
}
$('#chips').addEventListener('click', function(e){ var b = e.target.closest('[data-f]'); if(b){ filter = b.dataset.f; shown = PAGE; render(); } });
$('#q').addEventListener('input', function(){ query = this.value; shown = PAGE; render(); });
$('#views').addEventListener('click', function(e){ var b = e.target.closest('[data-v]'); if(b){ view = b.dataset.v; store.set('ac.view', view); shown = PAGE; render(); window.scrollTo(0, 0); } });
$('#list').addEventListener('click', function(e){
  var ok = e.target.closest('[data-ok]'), no = e.target.closest('[data-no]');
  if(ok || no){
    var orig = data[(ok || no).getAttribute(ok ? 'data-ok' : 'data-no')]; if(!orig) return;
    var g = copy(orig);
    if(ok){ g.ok = true; touch(g); toast(t('moved', orig.n), t('undo'), function(){ var b = copy(orig); touch(b); }); }
    else { g.del = true; touch(g); toast(t('deleted', orig.n), t('undo'), function(){ var b = copy(orig); delete b.del; touch(b); }); }
    return;
  }
  if(e.target.closest('#more')){ shown += PAGE * 2; render(); return; } if(e.target.closest('[data-stop]')) return; var li = e.target.closest('[data-id]'); if(li) edit(data[li.dataset.id]); });
$('#add').onclick = function(){ edit(null); };

function touch(x){ x.t = Date.now(); data[x.id] = x; dirty = true; store.set(KEY.data, data); store.set(KEY.dirty, dirty); render(); syncSoon(); }
var copy = function(x){ return JSON.parse(JSON.stringify(x)); };
/* another entry with the same phone, website or name: we probably already have this customer */
function twin(x){
  var d = digits(x.tel).slice(-8), h = x.web ? webHost(x.web).toLowerCase() : '', n = norm(x.n).trim();
  return live().filter(function(o){ return o.id !== x.id && ((d.length >= 6 && digits(o.tel).slice(-8) === d) || (h && o.web && webHost(o.web).toLowerCase() === h) || (n && norm(o.n).trim() === n)); })[0] || null;
}

function edit(orig){
  var x = orig ? copy(orig) : { id: uid(), n: '', r: '', tel: '', lugar: '', web: '', est: 'nuevo', notas: '', log: [], c: Date.now(), ok: true };
  var f = function(id, label, val, extra){ return '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" value="' + esc(val) + '" autocomplete="off" ' + (extra || '') + '></div>'; };
  var ph = function(k){ return 'placeholder="' + esc(t(k)) + '"'; };
  var mapUrl = orig ? mapHref(x) : '';
  var html = '<h3>' + esc(orig ? orig.n : t('add')) + '</h3>' +
    (orig && (x.tel || webHref(x.web) || mapUrl) ? '<div class="quick">' + (x.tel ? '<a href="' + esc(telHref(x.tel)) + '">' + esc(t('call')) + '</a>' : '') + (waHref(x.tel) ? '<a href="' + esc(waHref(x.tel)) + '" target="_blank" rel="noopener noreferrer">WhatsApp</a>' : '') + (webHref(x.web) ? '<a href="' + esc(webHref(x.web)) + '" target="_blank" rel="noopener noreferrer">' + esc(t('open_web')) + '</a>' : '') + (mapUrl ? '<a href="' + esc(mapUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(t('map')) + '</a>' : '') + '</div>' : '') +
    f('eN', esc(t('f_name')) + ' <span class="req">*</span>', x.n, 'autocapitalize="words"') +
    '<div class="grid2">' + f('eR', esc(t('f_rubro')), x.r, ph('ph_rubro') + ' autocapitalize="sentences"') + f('eTel', esc(t('f_tel')), x.tel, 'type="tel" inputmode="tel" placeholder="+54 9 11 2345-6789"') + '</div>' +
    '<div class="grid2">' + f('eL', esc(t('f_place')), x.lugar, ph('ph_place') + ' autocapitalize="words"') + f('eW', esc(t('f_web')), x.web, 'type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="www.ejemplo.com.ar"') + '</div>' +
    '<div class="field"><span class="lbl">' + esc(t('f_state')) + '</span><div class="est" id="eEst">' + EST.map(function(s){ return '<button type="button" data-e="' + s + '"' + (x.est === s ? ' class="on"' : '') + '>' + esc(estName(s)) + '</button>'; }).join('') + '</div></div>' +
    '<div class="field"><label for="eNo">' + esc(t('f_notes')) + '</label><textarea id="eNo" ' + ph('ph_notes') + '>' + esc(x.notas) + '</textarea></div>' +
    '<hr><span class="lbl">' + esc(t('contacts')) + '</span><ul class="log" id="eLog"></ul>' +
    '<div class="addlog"><input id="eLn" ' + ph('ph_log') + ' autocomplete="off"><input id="eLd" type="date" style="flex:0 0 150px" aria-label="' + esc(t('date')) + '"></div>' +
    '<button class="btn go wide" id="eLg" type="button" style="margin-top:8px">' + esc(t('log_btn')) + '</button>' +
    '<div id="eMsg"></div><hr>' +
    '<div class="row2">' + (orig ? '<button class="btn danger" id="eDel" type="button">' + esc(t('delete')) + '</button>' : '') + '<button class="btn" data-close type="button">' + esc(t('cancel')) + '</button><button class="btn primary" id="eOk" type="button">' + esc(t('save')) + '</button></div>';
  modal(html, function(el){
    var read = function(){ x.n = $('#eN', el).value.trim(); x.r = $('#eR', el).value.trim(); x.tel = $('#eTel', el).value.trim(); x.lugar = $('#eL', el).value.trim(); x.web = $('#eW', el).value.trim(); x.notas = $('#eNo', el).value.trim(); };
    var msg = function(h, c){ $('#eMsg', el).innerHTML = h ? '<div class="msg ' + (c || 'err') + '">' + h + '</div>' : ''; };
    var drawLog = function(){
      var l = (x.log || []).slice().sort(byDate);
      $('#eLog', el).innerHTML = l.length ? l.map(function(e){ return '<li>' + (e.n ? esc(e.n) : '<i>' + esc(t('log_contacted')) + '</i>') + '<small>' + esc(dayText(e.d)) + (e.by ? ' · ' + esc(e.by) : '') + '</small></li>'; }).join('') : '<li style="border-color:var(--line)"><small>' + esc(t('log_none')) + '</small></li>';
    };
    drawLog();
    $('#eLd', el).value = todayIso(); $('#eLd', el).max = todayIso();
    $('#eEst', el).onclick = function(e){ var b = e.target.closest('[data-e]'); if(!b) return; x.est = b.dataset.e; [].forEach.call(el.querySelectorAll('#eEst button'), function(o){ o.classList.toggle('on', o === b); }); };
    $('#eLg', el).onclick = function(){
      var d = $('#eLd', el).value || todayIso();
      x.log = (x.log || []).concat([{ d: d > todayIso() ? todayIso() : d, n: $('#eLn', el).value.trim(), by: cfg.name, t: Date.now() }]);
      if(x.est === 'nuevo'){ x.est = 'contactado'; [].forEach.call(el.querySelectorAll('#eEst button'), function(o){ o.classList.toggle('on', o.dataset.e === 'contactado'); }); }
      $('#eLn', el).value = ''; drawLog();
      msg(t('log_added'), 'ok');
    };
    $('#eLn', el).onkeydown = function(e){ if(e.key === 'Enter') $('#eLg', el).click(); };
    var forceTwin = false;
    $('#eOk', el).onclick = function(){
      read();
      if($('#eLn', el).value.trim()){ $('#eLg', el).click(); }
      if(!x.n){ msg(esc(t('err_cname'))); $('#eN', el).focus(); return; }
      if(x.web && !webHref(x.web)){ msg(esc(t('err_web'))); return; }
      var tw = !orig && !forceTwin && twin(x);
      if(tw){ forceTwin = true; msg(th('twin', tw.n, tw.est && tw.est !== 'nuevo' ? ' (' + estName(tw.est) + ')' : ''), 'warn'); return; }
      close(el);
      var prev = orig ? copy(orig) : null;
      if(digits(x.tel).length >= 6 || (x.log || []).length) x.ok = true;
      touch(x);
      toast(orig ? t('saved') : t('added', x.n), t('undo'), function(){ if(prev) touch(prev); else { var g = copy(x); g.del = true; touch(g); } });
    };
    if(orig) $('#eDel', el).onclick = function(){
      var g = copy(orig); g.del = true; close(el); touch(g);
      toast(t('deleted', orig.n), t('undo'), function(){ var b = copy(orig); delete b.del; touch(b); });
    };
    if(!orig) setTimeout(function(){ $('#eN', el).focus(); }, 50);
  });
}

/* ---------- settings ---------- */
function csv(){
  var q = function(v){ v = String(v == null ? '' : v); return /[",;\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var rows = [TX[lang].csv];
  live().sort(function(a, b){ return norm(a.n).localeCompare(norm(b.n)); }).forEach(function(x){ var l = lastLog(x); rows.push([x.n, x.r, x.tel, x.lugar, x.web, estName(x.est), l ? l.d : '', l ? l.by : '', (x.log || []).length, x.notas]); });
  return '﻿' + rows.map(function(r){ return r.map(q).join(';'); }).join('\r\n') + '\r\n';
}
$('#gear').onclick = function(){
  modal('<h3>' + esc(t('settings')) + '</h3><p>' + th('dev_of', cfg.name) + '<br><span class="hint">' + esc(t('data_in', cfg.repo)) + '</span></p>' +
    '<span class="lbl">' + esc(t('language')) + '</span><div class="lang big">' + langButtons.call({ big: true }, lang) + '</div>' +
    '<div style="display:grid;gap:8px;margin-top:14px"><button class="btn" id="gShare" type="button">' + esc(t('g_share')) + '</button><button class="btn" id="gCsv" type="button">' + esc(t('g_csv')) + '</button><button class="btn" id="gSync" type="button">' + esc(t('g_sync')) + '</button><button class="btn" id="gSetup" type="button">' + esc(t('g_setup')) + '</button><button class="btn primary" data-close type="button">' + esc(t('close')) + '</button></div>', function(el){
    $('.lang', el).addEventListener('click', function(e){ if(e.target.closest('[data-lang]')){ setTimeout(function(){ close(el); $('#gear').click(); }); } });
    $('#gShare', el).onclick = function(){ close(el); shareAccess(false); };
    $('#gCsv', el).onclick = function(){ download('ausblick-clientes-' + todayIso() + '.csv', csv(), 'text/csv'); };
    $('#gSync', el).onclick = function(){ close(el); syncNow(); };
    $('#gSetup', el).onclick = function(){ close(el); $('#setup').hidden = false; $('#app').hidden = true; $('#sName').value = cfg.name; drawSetup(); setMode('code'); $('#sCode').value = showCode(cfg.code); };
  });
};

/* ---------- small windows ---------- */
function modal(html, init){
  var ov = document.createElement('div'); ov.className = 'ov'; ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  ov.addEventListener('click', function(e){ if(e.target === ov || e.target.closest('[data-close]')) close(ov); });
  $('#layer').appendChild(ov); if(init) init(ov); return ov;
}
function close(el){ if(el && el.parentNode) el.parentNode.removeChild(el); }
document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ var o = $('#layer .ov:last-child'); if(o) close(o); } });
var toastT = 0;
function toast(text, act, fn){
  var old = $('.toast'); if(old) close(old);
  var el = document.createElement('div'); el.className = 'toast'; el.innerHTML = '<span>' + esc(text) + '</span>' + (act ? '<button type="button">' + esc(act) + '</button>' : '');
  if(act) el.querySelector('button').onclick = function(){ close(el); fn(); };
  document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(function(){ close(el); }, 6000);
}

/* ---------- saving to GitHub ---------- */
function setSync(st, k, arg){ sync.label = [st, k, arg]; var p = $('#sync'); p.className = 'pill ' + st; p.lastChild.textContent = k === '…' ? '…' : t(k, arg); }
function syncSoon(){ clearTimeout(sync.timer); setSync('wait', 's_saving'); sync.timer = setTimeout(syncNow, 1200); }
function api(opt){
  opt = opt || {}; opt.headers = Object.assign({ Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json' }, opt.headers || {}); opt.cache = 'no-store';
  return fetch('https://api.github.com/repos/' + cfg.repo + '/contents/' + FILE, opt);
}
/* newer change wins per customer; contact entries from both sides are kept */
function merge(remote){
  var changed = false;
  Object.keys(remote || {}).forEach(function(id){
    var r = remote[id], l = data[id];
    if(!r) return;
    if(!l){ data[id] = r; changed = true; return; }
    var win = (r.t || 0) > (l.t || 0) ? copy(r) : l, seen = {}, log = [];
    (l.log || []).concat(r.log || []).forEach(function(e){ var k = e.t + '|' + e.by; if(!seen[k]){ seen[k] = 1; log.push(e); } });
    if(win !== l || log.length !== (l.log || []).length){ win.log = log; data[id] = win; changed = true; }
  });
  return changed;
}
async function load(){
  var r = await api();
  if(r.status === 404) return { sha: null, c: {} };
  if(!r.ok) throw new Error('http ' + r.status);
  var j = await r.json(), txt = j.content ? b64d(j.content) : '';
  if(!txt && j.size){ var rr = await api({ headers: { Accept: 'application/vnd.github.raw' } }); if(!rr.ok) throw new Error('http ' + rr.status); txt = await rr.text(); }
  var o = JSON.parse(txt || '{}');
  return { sha: j.sha, c: o.c || {} };
}
async function save(){
  for(var tries = 0; tries < 3; tries++){
    var cur = await load(); merge(cur.c);
    var body = { message: cfg.name + ' ' + new Date().toISOString(), content: b64e(JSON.stringify({ v: 1, c: data }) + '\n') };
    if(cur.sha) body.sha = cur.sha;
    var r = await api({ method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if(r.ok) return;
    if(r.status !== 409 && r.status !== 422) throw new Error('http ' + r.status);
  }
  throw new Error('conflict');
}
async function syncNow(){
  if(!cfg) return;
  if(sync.busy){ sync.again = true; return; }
  sync.busy = true; clearTimeout(sync.timer);
  try{
    if(dirty){ dirty = false; store.set(KEY.dirty, dirty); try{ await save(); }catch(e){ dirty = true; store.set(KEY.dirty, dirty); throw e; } }
    else { var cur = await load(); merge(cur.c); }
    store.set(KEY.data, data);
    setSync('ok', 's_saved', hm(Date.now()));
  }catch(e){
    if(/http 401/.test(e.message)){
      var fresh = null; try{ fresh = await openAccess(cfg.code); }catch(x){}
      if(fresh && fresh.token !== cfg.token){ cfg.token = fresh.token; cfg.repo = fresh.repo; store.set(KEY.cfg, cfg); sync.busy = false; return syncNow(); }   /* someone replaced the token */
      setSync('err', 's_expired');
    }
    else setSync(dirty ? 'wait' : 'err', dirty ? 's_later' : 's_offline');
  }
  sync.busy = false; render();
  if(sync.again){ sync.again = false; syncNow(); }
}
setInterval(function(){ if(cfg && document.visibilityState === 'visible') syncNow(); }, 60000);
addEventListener('online', function(){ syncNow(); });
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') syncNow(); });

applyLang();
show();
if(cfg){ setSync(dirty ? 'wait' : 'ok', '…'); syncNow(); }
window.__ac = { get data(){ return data; }, get cfg(){ return cfg; }, syncNow: syncNow, sealAccess: sealAccess, setLang: setLang };
})();
